name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: euddraft-windows
          - os: macos-latest
            artifact_name: euddraft-macos
          - os: ubuntu-latest
            artifact_name: euddraft-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev

      - name: Install dependencies
        run: uv sync

      - name: Build release
        env:
          CFLAGS: "-Dfdopen=fdopen"
        run: uv run python mkdist.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: latest/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog delta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re, sys
          version = sys.argv[1]
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(version)}\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          body = match.group(0).strip() if match else f'Release {version}'
          with open('release_notes.md', 'w') as f:
              f.write(body)
          " "$VERSION"

      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            euddraft-windows/*.zip
            euddraft-macos/*.zip
            euddraft-linux/*.zip
