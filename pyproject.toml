[project]
name = "euddraft"
version = "0.11.0.1"
description = "Framework for creating & applying various plugins to StarCraft map."
authors = [
    { name = "armoha", email = "kein0011@naver.com" },
    { name = "Park Hyun Woo", email = "phu54321@naver.com" },
]
requires-python = ">= 3.10, < 3.16"
readme = "README.md"
license = "MIT"
dependencies = [
    "cx-Freeze>=8.3.0,<9",
    "rich>=13.8.1,<14",
    "openpyxl>=3.1.3,<4",
    "typing_extensions>=4.12.2,<5",
    "eudplib>=0.81.0,<0.82",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.cxfreeze]
executables = ["euddraft.py"]

[tool.cxfreeze.build_exe]
packages = ["os", "ctypes", "sys", "importlib", "json", "eudplib", "openpyxl", "encodings"]
excludes = ["tkinter"]
optimize = 2
include-msvcr = true
zip-include-packages = "*"
zip-exclude-packages = []
include-files = [
    "license.txt",
    "plugins",
    "lib",
]
